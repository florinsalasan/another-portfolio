# The URL the site will be built for
base_url = "https://florinsalasan.dev"

title = "Florin Salasan"
description = "Software developer based in the GTA. Writing about building software in the open, systems, and books."
default_language = "en"

# Automatically compile Sass files in the sass directory
compile_sass = false

# Build a search index to be used later on by a JavaScript library
build_search_index = true

# Generate RSS feed
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

taxonomies = [
    { name = "tags", feed = true },
    { name = "technologies", feed = false },
]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
smart_punctuation = true

[extra]
author = "Florin Salasan"
email = "me@florinsalasan.dev"
github = "https://github.com/florinsalasan"
linkedin = "https://www.linkedin.com/in/florinsalasan/"
location = "Greater Toronto Area, ON"
