[[books]]
title = "Ultralearning"
author = "Scott H. Young"
status = "Finished"
date_read = "2024"
rating = 5
isbn = "9780008305727"
cover = "/images/books/ultralearning.jpg"
tags = ["learning", "productivity", "skill-acquisition"]
summary = "Master hard skills, outsmart the competition, and accelerate your career through aggressive, self-directed learning."
review = """
**Key takeaway:** Learn by doing directly rather than getting stuck in passive theory first.

In high school and university, the default approach was always theory first followed by attempting to apply it. *Ultralearning* flips that on its head: run into the wall while trying to accomplish a real task, and then use theory to solve the exact obstacle in front of you.

This inspired me to escape "tutorial hell" by building projects from scratch and maintaining a daily coding habit.
"""

[[books]]
title = "Effortless"
author = "Greg McKeown"
status = "Finished"
date_read = "2024"
rating = 4
isbn = "9780593401118"
cover = "/images/books/effortless.jpg"
tags = ["productivity", "mindset"]
summary = "Make it easier to do what matters most by removing unnecessary friction from daily habits and projects."
review = """
A solid follow-up to *Essentialism*. Instead of brute-forcing every goal through sheer willpower, *Effortless* focuses on designing systems with lower activation energy so that starting—and staying consistent—becomes the path of least resistance.
"""

